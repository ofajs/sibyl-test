name: 'Sibyl Test'
description: 'Run browser tests using Sibyl Test framework'
author: 'Yao'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  browsers:
    description: 'Comma-separated list of browsers to test (webkit, chrome, firefox)'
    required: false
    default: 'webkit,chrome,firefox'
  working-directory:
    description: 'Working directory for running tests'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
    
    - name: Install Playwright browsers
      shell: bash
      run: |
        PLAYWRIGHT_BROWSERS=""
        if echo "${{ inputs.browsers }}" | grep -q "webkit"; then
          PLAYWRIGHT_BROWSERS="$PLAYWRIGHT_BROWSERS webkit"
        fi
        if echo "${{ inputs.browsers }}" | grep -q "chrome"; then
          PLAYWRIGHT_BROWSERS="$PLAYWRIGHT_BROWSERS chromium"
        fi
        if [ -n "$PLAYWRIGHT_BROWSERS" ]; then
          npx playwright install --with-deps $PLAYWRIGHT_BROWSERS
        fi
    
    - name: Install Firefox
      if: runner.os == 'Linux'
      uses: browser-actions/setup-firefox@latest

    - name: Install geckodriver
      if: runner.os == 'Linux'
      uses: browser-actions/setup-geckodriver@latest

    - name: Install Firefox (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install --cask firefox
        brew install geckodriver
    
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          xvfb-run npx sb-test --browsers ${{ inputs.browsers }}
        else
          npx sb-test --browsers ${{ inputs.browsers }}
        fi
